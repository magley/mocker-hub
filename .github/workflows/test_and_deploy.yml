name: Run Tests And Deploy Application To A Docker Registry

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.jpg'
      - '**/*.png'
      - '**/*.txt'
      - 'docs/**'

      # We don't test the client app, so we can ignore changes made to it when running the workflow.
      - 'client/**'
jobs:
  test: # This should be the same as in run_tests.yml!
    runs-on: ubuntu-latest

    steps:
    - name: Checkout to branch
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10.15'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r server/requirements.txt
    
    - name: Create .env file
      run: |
        echo "RUN_TESTS=true" > .env

    - name: Run the tests
      # Specify that we're bulding `backend` => `--abort-on-container-exit` will only work for `backend`
      # But we must be careful about `depends-on` in `compose.yaml`.
      # https://stackoverflow.com/a/76049965
      run: |
        sudo docker compose build
        sudo docker compose up --build backend --abort-on-container-exit --exit-code-from backend

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy image to Docker Hub
        run: |
          docker compose build
          docker compose push